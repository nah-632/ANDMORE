name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast if lockfile missing
        run: |
          test -f package-lock.json || { echo "::error::package-lock.json missing — run the lockfile bootstrap workflow"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (dev deps included)
        run: npm ci --include=dev

      - name: Light checks
        run: node scripts/run-light-checks.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint || npx eslint src --ext .ts,.tsx

      - name: Unit tests (node:test)
        run: npm run test:unit

      - name: Build
        run: npx next build

      - name: Dump crash site (diagnostic, remove after fix)
        if: failure()
        run: |
          F='.next/server/app/[locale]/styleguide/page.js'
          if [ -f "$F" ]; then
            echo "=== line 2, cols 16900-17600 ==="
            sed -n '2p' "$F" | cut -c16900-17600
          else
            echo "compiled file not found"
            find .next/server -name "page.js" | head
          fi

  rls:
    runs-on: ubuntu-latest
    needs: build
    # Wired in P1 with the Supabase CLI against a real project.
    if: false
    steps:
      - uses: actions/checkout@v4
